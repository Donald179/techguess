<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#102B46" />
  <title>TECHGEST — Gestion des clients</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./assets/images/icon.ico" type="image/x-icon" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="./assets/css/shared.css" rel="stylesheet" />
  <link href="./assets/css/clients.css" rel="stylesheet" />
</head>
<body>
  <div id="tg-toast-container"></div>
  <div id="tg-sidebar-mount"></div>

  <div class="tg-main">
    <div id="tg-topbar-mount"></div>

    <main class="container-fluid p-3 p-lg-4">
      <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-4">
        <div>
          <h1 class="h4 fw-bold mb-0">Gestion des clients</h1>
          <small class="text-muted">Répertoire clients, fiches détaillées, historique des prestations et archivage</small>
        </div>
        <div class="btn-group btn-group-sm">
          <button type="button" class="btn tg-btn-navy" id="btn-filter-active">Actifs</button>
          <button type="button" class="btn btn-outline-secondary" id="btn-filter-archived">Archivés</button>
        </div>
      </div>

      <!-- Formulaire ajout rapide -->
      <div class="tg-card p-3 mb-4">
        <h2 class="h6 fw-bold mb-2">Ajouter un nouveau client</h2>
        <form id="form-add-client" class="row g-2">
          <div class="col-md-3">
            <input type="text" name="fullName" class="form-control form-control-sm" placeholder="Nom complet / Société *" required />
          </div>
          <div class="col-md-2">
            <input type="text" name="phone" class="form-control form-control-sm" placeholder="Téléphone" />
          </div>
          <div class="col-md-2">
            <input type="email" name="email" class="form-control form-control-sm" placeholder="Email" />
          </div>
          <div class="col-md-2">
            <input type="text" name="address" class="form-control form-control-sm" placeholder="Adresse / Quartier" />
          </div>
          <div class="col-md-1">
            <select name="clientType" class="form-select form-select-sm">
              <option>Particulier</option>
              <option>Entreprise</option>
              <option>Administration</option>
              <option>Association</option>
            </select>
          </div>
          <div class="col-md-2 d-grid">
            <button type="submit" class="btn tg-btn-primary btn-sm">+ Ajouter le client</button>
          </div>
          <div class="col-12">
            <input type="text" name="notes" class="form-control form-control-sm" placeholder="Notes techniques (parc informatique, configuration, remarques)..." />
          </div>
        </form>
      </div>

      <!-- Barre de recherche -->
      <div class="mb-3 d-flex flex-wrap gap-2">
        <input type="text" id="input-search-client" class="form-control form-control-sm tg-search-input" placeholder="Rechercher un client par nom, téléphone, email ou adresse..." />
      </div>

      <!-- Grille des clients -->
      <div class="row g-3" id="clients-grid"></div>
    </main>
  </div>

  <div id="tg-mobilenav-mount"></div>

  <!-- Modale Fiche Client & Modification -->
  <div class="modal fade" id="clientModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
      <div class="modal-content rounded-4 border-0 shadow-lg">
        <div class="modal-header text-white" style="background:#102B46;">
          <h5 class="modal-title fw-bold fs-6" id="clientModalTitle">Fiche Client</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body p-4" id="clientModalBody"></div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="./assets/js/supabase-config.js"></script>
  <script src="./assets/js/db.js"></script>
  <script src="./assets/js/supabase-service.js"></script>
  <script src="./assets/js/sync.js"></script>
  <script src="./assets/js/pdf-export.js"></script>
  <script src="./assets/js/layout.js"></script>
  <script src="./assets/js/clients.js"></script>
</body>
</html>
