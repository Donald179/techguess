<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#102B46" />
  <title>TECHGEST — Gestion des dépenses</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./assets/images/icon.ico" type="image/x-icon" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="./assets/css/shared.css" rel="stylesheet" />
  <link href="./assets/css/depenses.css" rel="stylesheet" />
</head>
<body>
  <div id="tg-toast-container"></div>
  <div id="tg-sidebar-mount"></div>

  <div class="tg-main">
    <div id="tg-topbar-mount"></div>

    <main class="container-fluid p-3 p-lg-4">
      <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-4">
        <div>
          <h1 class="h4 fw-bold mb-0">Gestion des dépenses</h1>
          <small class="text-muted">Suivi des charges : transport, matériel informatique, internet, électricité et fournitures</small>
        </div>
        <div class="tg-expense-total-pill px-3 py-2 rounded-3 small fw-bold" id="total-expenses-banner">
          Total dépenses : 0 FCFA
        </div>
      </div>

      <!-- Formulaire ajout dépense -->
      <div class="tg-card p-3 mb-4">
        <h2 class="h6 fw-bold mb-2">Enregistrer une dépense</h2>
        <form id="form-add-expense" class="row g-2">
          <div class="col-md-3">
            <label class="form-label small fw-bold mb-1">Nom de la dépense *</label>
            <input type="text" name="title" class="form-control form-control-sm" placeholder="Ex: Disque SSD 1To ou Carburant" required />
          </div>
          <div class="col-md-2">
            <label class="form-label small fw-bold mb-1">Catégorie *</label>
            <select name="category" class="form-select form-select-sm">
              <option>Transport</option>
              <option>Matériel informatique</option>
              <option>Internet</option>
              <option>Électricité</option>
              <option>Fournitures</option>
              <option>Autres charges</option>
            </select>
          </div>
          <div class="col-md-2">
            <label class="form-label small fw-bold mb-1">Montant (FCFA) *</label>
            <input type="number" name="amount" min="0" value="5000" class="form-control form-control-sm fw-bold" required />
          </div>
          <div class="col-md-2">
            <label class="form-label small fw-bold mb-1">Date *</label>
            <input type="date" name="expenseDate" id="input-expense-date" class="form-control form-control-sm" required />
          </div>
          <div class="col-md-3">
            <label class="form-label small fw-bold mb-1">Description</label>
            <div class="d-flex gap-2">
              <input type="text" name="description" class="form-control form-control-sm" placeholder="Justificatif..." />
              <button type="submit" class="btn tg-btn-primary btn-sm text-nowrap">+ Ajouter</button>
            </div>
          </div>
        </form>
      </div>

      <!-- Filtres -->
      <div class="tg-card p-3 mb-3 row g-2">
        <div class="col-md-6">
          <select id="filter-exp-cat" class="form-select form-select-sm">
            <option value="ALL">Toutes les catégories</option>
            <option>Transport</option>
            <option>Matériel informatique</option>
            <option>Internet</option>
            <option>Électricité</option>
            <option>Fournitures</option>
            <option>Autres charges</option>
          </select>
        </div>
        <div class="col-md-6">
          <select id="filter-exp-period" class="form-select form-select-sm">
            <option value="all">Toutes les périodes</option>
            <option value="month">Ce mois en cours</option>
            <option value="year">Cette année</option>
          </select>
        </div>
      </div>

      <!-- Tableau des dépenses -->
      <div class="tg-card overflow-hidden">
        <div class="table-responsive">
          <table class="table table-hover align-middle mb-0 small">
            <thead class="table-light">
              <tr>
                <th>Date</th>
                <th>Dépense</th>
                <th>Catégorie</th>
                <th>Description</th>
                <th class="text-end">Montant</th>
                <th class="text-end">Action</th>
              </tr>
            </thead>
            <tbody id="expenses-tbody"></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <div id="tg-mobilenav-mount"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./assets/js/supabase-config.js"></script>
  <script src="./assets/js/db.js"></script>
  <script src="./assets/js/supabase-service.js"></script>
  <script src="./assets/js/sync.js"></script>
  <script src="./assets/js/pdf-export.js"></script>
  <script src="./assets/js/layout.js"></script>
  <script src="./assets/js/depenses.js"></script>
</body>
</html>
