<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#102B46" />
  <title>TECHGEST — Devis &amp; Factures PDF</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./assets/images/icon.ico" type="image/x-icon" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="./assets/css/shared.css" rel="stylesheet" />
  <link href="./assets/css/devis-factures.css" rel="stylesheet" />
</head>
<body>
  <div id="tg-toast-container"></div>
  <div id="tg-sidebar-mount"></div>

  <div class="tg-main">
    <div id="tg-topbar-mount"></div>

    <main class="container-fluid p-3 p-lg-4">
      <div class="mb-4">
        <h1 class="h4 fw-bold mb-0">Gestion des devis et factures PDF</h1>
        <small class="text-muted">Création de devis, conversion en prestation et génération de factures PDF numérotées</small>
      </div>

      <div class="row g-4">
        <!-- Colonne Devis -->
        <div class="col-lg-6">
          <div class="tg-card p-3 mb-3">
            <h2 class="h6 fw-bold mb-2">Créer un nouveau devis</h2>
            <form id="form-add-quote" class="vstack gap-2 small">
              <div class="row g-2">
                <div class="col-6">
                  <select name="clientId" id="select-quote-client" class="form-select form-select-sm" required></select>
                </div>
                <div class="col-6">
                  <select name="category" class="form-select form-select-sm">
                    <option>Maintenance informatique</option>
                    <option>Réparation</option>
                    <option>Installation de logiciels</option>
                    <option>Installation Windows</option>
                    <option>Dépannage</option>
                    <option>Sécurité informatique</option>
                    <option>Récupération de données</option>
                    <option>Assistance à distance</option>
                    <option>Formation</option>
                    <option>Autres services</option>
                  </select>
                </div>
              </div>
              <input type="text" name="title" class="form-control form-control-sm" placeholder="Intitulé du devis *" required />
              <div class="row g-2">
                <div class="col-6"><input type="text" name="itemDesc" class="form-control form-control-sm" placeholder="Désignation ligne *" required /></div>
                <div class="col-2"><input type="number" name="itemQty" min="1" value="1" class="form-control form-control-sm text-center" /></div>
                <div class="col-4"><input type="number" name="itemPrice" min="0" value="50000" class="form-control form-control-sm" placeholder="Prix U." /></div>
              </div>
              <button type="submit" class="btn tg-btn-primary btn-sm">+ Enregistrer le devis</button>
            </form>
          </div>

          <div class="tg-card p-3">
            <h2 class="h6 fw-bold mb-3" id="quotes-list-title">Devis enregistrés</h2>
            <div class="vstack gap-2" id="quotes-list"></div>
          </div>
        </div>

        <!-- Colonne Factures -->
        <div class="col-lg-6">
          <div class="tg-card p-3 mb-3">
            <h2 class="h6 fw-bold mb-2">Générer une facture depuis une prestation</h2>
            <form id="form-generate-invoice" class="row g-2">
              <div class="col-8">
                <select name="prestationId" id="select-invoice-prestation" class="form-select form-select-sm" required></select>
              </div>
              <div class="col-4 d-grid">
                <button type="submit" class="btn tg-btn-navy btn-sm">Créer facture</button>
              </div>
            </form>
          </div>

          <div class="tg-card p-3">
            <h2 class="h6 fw-bold mb-3" id="invoices-list-title">Factures générées (PDF)</h2>
            <div class="vstack gap-2" id="invoices-list"></div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <div id="tg-mobilenav-mount"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./assets/js/supabase-config.js"></script>
  <script src="./assets/js/db.js"></script>
  <script src="./assets/js/supabase-service.js"></script>
  <script src="./assets/js/sync.js"></script>
  <script src="./assets/js/pdf-export.js"></script>
  <script src="./assets/js/layout.js"></script>
  <script src="./assets/js/devis-factures.js"></script>
</body>
</html>
