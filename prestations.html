<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#102B46" />
  <title>TECHGEST — Gestion des prestations</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./assets/images/icon.ico" type="image/x-icon" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="./assets/css/shared.css" rel="stylesheet" />
  <link href="./assets/css/prestations.css" rel="stylesheet" />
</head>
<body>
  <div id="tg-toast-container"></div>
  <div id="tg-sidebar-mount"></div>

  <div class="tg-main">
    <div id="tg-topbar-mount"></div>

    <main class="container-fluid p-3 p-lg-4">
      <div class="mb-4">
        <h1 class="h4 fw-bold mb-0">Gestion des prestations</h1>
        <small class="text-muted">Référence automatique, catégories informatiques, statuts d'avancement et suivi paiement</small>
      </div>

      <!-- Formulaire nouvelle prestation -->
      <div class="tg-card p-3 mb-4">
        <h2 class="h6 fw-bold mb-2">Enregistrer une nouvelle prestation</h2>
        <form id="form-add-prestation" class="row g-2">
          <div class="col-md-2">
            <label class="form-label small fw-bold mb-1">Référence auto</label>
            <input type="text" id="input-auto-ref" class="form-control form-control-sm fw-bold tg-text-blue" readonly />
          </div>
          <div class="col-md-3">
            <label class="form-label small fw-bold mb-1">Client *</label>
            <select name="clientId" id="select-prestation-client" class="form-select form-select-sm" required></select>
          </div>
          <div class="col-md-4">
            <label class="form-label small fw-bold mb-1">Nom du service *</label>
            <input type="text" name="serviceName" class="form-control form-control-sm" placeholder="Ex: Installation Windows 11 Pro & Office" required />
          </div>
          <div class="col-md-3">
            <label class="form-label small fw-bold mb-1">Catégorie *</label>
            <select name="category" class="form-select form-select-sm">
              <option>Maintenance informatique</option>
              <option>Réparation</option>
              <option>Installation de logiciels</option>
              <option>Installation Windows</option>
              <option>Dépannage</option>
              <option>Sécurité informatique</option>
              <option>Récupération de données</option>
              <option>Assistance à distance</option>
              <option>Formation</option>
              <option>Autres services</option>
            </select>
          </div>
          <div class="col-md-2">
            <label class="form-label small fw-bold mb-1">Prix (FCFA) *</label>
            <input type="number" name="price" min="0" step="500" value="25000" class="form-control form-control-sm fw-bold" required />
          </div>
          <div class="col-md-2">
            <label class="form-label small fw-bold mb-1">Date prestation *</label>
            <input type="date" name="serviceDate" id="input-service-date" class="form-control form-control-sm" required />
          </div>
          <div class="col-md-2">
            <label class="form-label small fw-bold mb-1">Statut travail</label>
            <select name="workStatus" class="form-select form-select-sm">
              <option>En attente</option>
              <option>En cours</option>
              <option>Terminée</option>
              <option>Annulée</option>
            </select>
          </div>
          <div class="col-md-4">
            <label class="form-label small fw-bold mb-1">Description détaillée</label>
            <input type="text" name="description" class="form-control form-control-sm" placeholder="Diagnostic, pièces remplacées, travaux réalisés..." />
          </div>
          <div class="col-md-2 d-grid align-items-end">
            <button type="submit" class="btn tg-btn-primary btn-sm">+ Enregistrer</button>
          </div>
        </form>
      </div>

      <!-- Filtres -->
      <div class="tg-card p-3 mb-3 row g-2">
        <div class="col-md-4">
          <input type="text" id="filter-prest-search" class="form-control form-control-sm" placeholder="Rechercher par référence, service ou client..." />
        </div>
        <div class="col-md-4">
          <select id="filter-prest-cat" class="form-select form-select-sm">
            <option value="ALL">Toutes les catégories</option>
            <option>Maintenance informatique</option>
            <option>Réparation</option>
            <option>Installation de logiciels</option>
            <option>Installation Windows</option>
            <option>Dépannage</option>
            <option>Sécurité informatique</option>
            <option>Récupération de données</option>
            <option>Assistance à distance</option>
            <option>Formation</option>
            <option>Autres services</option>
          </select>
        </div>
        <div class="col-md-4">
          <select id="filter-prest-status" class="form-select form-select-sm">
            <option value="ALL">Tous les statuts du travail</option>
            <option>En attente</option>
            <option>En cours</option>
            <option>Terminée</option>
            <option>Annulée</option>
          </select>
        </div>
      </div>

      <!-- Tableau des prestations -->
      <div class="tg-card overflow-hidden">
        <div class="table-responsive">
          <table class="table table-hover align-middle mb-0 small">
            <thead class="table-light">
              <tr>
                <th>Réf &amp; Date</th>
                <th>Client &amp; Service</th>
                <th>Catégorie</th>
                <th>Statut travail</th>
                <th>Statut paiement</th>
                <th class="text-end">Montant / Solde</th>
                <th class="text-end">Actions</th>
              </tr>
            </thead>
            <tbody id="prestations-tbody"></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <div id="tg-mobilenav-mount"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./assets/js/supabase-config.js"></script>
  <script src="./assets/js/db.js"></script>
  <script src="./assets/js/supabase-service.js"></script>
  <script src="./assets/js/sync.js"></script>
  <script src="./assets/js/pdf-export.js"></script>
  <script src="./assets/js/layout.js"></script>
  <script src="./assets/js/prestations.js"></script>
</body>
</html>
