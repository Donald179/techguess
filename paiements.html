<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#102B46" />
  <title>TECHGEST — Gestion des paiements</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./assets/images/icon.ico" type="image/x-icon" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="./assets/css/shared.css" rel="stylesheet" />
  <link href="./assets/css/paiements.css" rel="stylesheet" />
</head>
<body>
  <div id="tg-toast-container"></div>
  <div id="tg-sidebar-mount"></div>

  <div class="tg-main">
    <div id="tg-topbar-mount"></div>

    <main class="container-fluid p-3 p-lg-4">
      <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-4">
        <div>
          <h1 class="h4 fw-bold mb-0">Gestion des paiements</h1>
          <small class="text-muted">Enregistrement de paiements complets ou partiels, calcul automatique des soldes</small>
        </div>
        <div class="tg-collected-pill px-3 py-2 rounded-3 small fw-bold" id="total-collected-banner">
          Total encaissé : 0 FCFA
        </div>
      </div>

      <!-- Formulaire encaissement -->
      <div class="tg-card p-3 mb-4">
        <h2 class="h6 fw-bold mb-2">Enregistrer un encaissement</h2>
        <form id="form-add-payment" class="row g-2">
          <div class="col-md-4">
            <label class="form-label small fw-bold mb-1">Prestation à régler *</label>
            <select name="prestationId" id="select-payment-prestation" class="form-select form-select-sm" required></select>
          </div>
          <div class="col-md-2">
            <label class="form-label small fw-bold mb-1">Montant (FCFA) *</label>
            <input type="number" name="amount" id="input-payment-amount" min="1" class="form-control form-control-sm fw-bold tg-text-green" required />
          </div>
          <div class="col-md-2">
            <label class="form-label small fw-bold mb-1">Moyen de paiement *</label>
            <select name="paymentMethod" class="form-select form-select-sm">
              <option>Espèces</option>
              <option>Orange Money</option>
              <option>Moov Money</option>
              <option>Telecel Money</option>
              <option>Wave</option>
              <option>Virement bancaire</option>
              <option>Autre</option>
            </select>
          </div>
          <div class="col-md-2">
            <label class="form-label small fw-bold mb-1">Date *</label>
            <input type="date" name="paymentDate" id="input-payment-date" class="form-control form-control-sm" required />
          </div>
          <div class="col-md-2 d-grid align-items-end">
            <button type="submit" class="btn tg-btn-green btn-sm">+ Encaisser</button>
          </div>
          <div class="col-12">
            <input type="text" name="notes" class="form-control form-control-sm" placeholder="Référence de transaction (ex: ID Orange Money, Wave, Virement) ou observation..." />
          </div>
        </form>
      </div>

      <!-- Filtres -->
      <div class="tg-card p-3 mb-3 row g-2">
        <div class="col-md-6">
          <select id="filter-pay-method" class="form-select form-select-sm">
            <option value="ALL">Tous les moyens de paiement</option>
            <option>Espèces</option>
            <option>Orange Money</option>
            <option>Moov Money</option>
            <option>Telecel Money</option>
            <option>Wave</option>
            <option>Virement bancaire</option>
            <option>Autre</option>
          </select>
        </div>
        <div class="col-md-6">
          <select id="filter-pay-period" class="form-select form-select-sm">
            <option value="all">Toutes les périodes</option>
            <option value="month">Ce mois en cours</option>
            <option value="year">Cette année</option>
          </select>
        </div>
      </div>

      <!-- Tableau transactions -->
      <div class="tg-card overflow-hidden">
        <div class="table-responsive">
          <table class="table table-hover align-middle mb-0 small">
            <thead class="table-light">
              <tr>
                <th>Réf / Date</th>
                <th>Client</th>
                <th>Prestation</th>
                <th>Moyen de paiement</th>
                <th>Solde prestation</th>
                <th class="text-end">Montant encaissé</th>
                <th class="text-end">Action</th>
              </tr>
            </thead>
            <tbody id="payments-tbody"></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <div id="tg-mobilenav-mount"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./assets/js/supabase-config.js"></script>
  <script src="./assets/js/db.js"></script>
  <script src="./assets/js/supabase-service.js"></script>
  <script src="./assets/js/sync.js"></script>
  <script src="./assets/js/pdf-export.js"></script>
  <script src="./assets/js/layout.js"></script>
  <script src="./assets/js/paiements.js"></script>
</body>
</html>
